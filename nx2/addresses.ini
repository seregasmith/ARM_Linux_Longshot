# Where Longshot's tools send things, and the pages they link to: the one place to edit when a service moves.
# Read by nx2/addresses.py (address(key)). A key left out or empty turns that use off: nothing is sent, and what was
# waiting stays for next time.
[addresses]
# Longshot-api's telemetry (/telemetry/crash): POST a crash report (the crash window's Report automatically), kept where only the team reads it
crash_reports = https://data-services.magicbean.dev/telemetry/crash
# Longshot-api's telemetry (/telemetry/perf): POST a performance summary (the launcher's Send performance statistics)
perf_reports = https://data-services.magicbean.dev/telemetry/perf
