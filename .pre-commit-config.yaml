default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
        exclude: ^(third_party/|gpu/third_party/|gpu/vk/sirit/|website/public/fonts/)
      - id: trailing-whitespace
        exclude: ^(third_party/|gpu/third_party/|gpu/vk/sirit/|website/public/fonts/)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/compilerla/conventional-pre-commit
    # v4.5.0
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - perf
          - refactor
          - docs
          - test
          - ci
          - build
          - chore
          - revert
  # ruff with ruff.toml's rules, on changed Python files; pinned here so any runner has it (same version as mise.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff   # (the hook's entry passes --force-exclude itself; given again, ruff refuses to run)
  - repo: local
    hooks:
      # manual until magicbeandev/ci@0.1.0 is published (hook needs the registry orb).
      - id: circleci-config-validate
        name: circleci config validate
        stages: [manual]
        entry: bash -c 'MB_ORB_DIR="${MB_ORB_DIR:?}"; bash "$MB_ORB_DIR/tools/validate.sh" "$(git rev-parse --show-toplevel)"'
        language: system
        pass_filenames: false
      - id: shellcheck-scripts
        name: ShellCheck (packaging scripts)
        entry: bash -c 'shellcheck -x -S error "$@"' --
        language: system
        types: [shell]
        files: ^scripts/(linux|windows)/.*\.sh$
