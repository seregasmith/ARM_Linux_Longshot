; Longshot on the AYN Odin 3: Snapdragon 8 Elite, Adreno 830 (Turnip), 16 GB shared, 1920x1080 at 120 Hz.
; A starting point, 2026-11-19. Put it in the game folder as longshot_options.ini (keep your own pad_ and key_ lines
; if you changed the controls: copy only these lines into your file then). Lines starting with ; are comments.
options_version=6
compile_shaders=0
; Quality preset Custom, so Auto (this PC) does not choose over these; the memory budgets of Minimum (4GB)
quality_preset=0
memory_budget=1
; Docked profile at the screen's own size, 1080p, pixel for pixel; 16:9
handheld_profile=0
output_res=1920x1080
ultrawide=1
; Upscaler AMD FSR 3.1, Render resolution 50% (Performance: 960x540 up to 1080p), its usual sharpening
dlss=3
resolution=4
sharpness=30
; Window scaling filter off: the output is the screen's size, nothing to scale
upscaling=0
; 60 fps cap (the console's), V-Sync Auto, frame pacing on, game time real time, no frame generation
frame_rate_cap=0
vsync=0
frame_pacing=1
game_speed=1
frame_generation=0
fullscreen=1
; Detail: 4x anisotropic filtering, the game's own shadow size (1600), no HDR, no CRT filter
anisotropic_filtering=2
shadow_resolution=1
hdr=0
crt_filter=0
; FPS counter on while you tune; a larger menu on a 6-inch screen
fps_counter=1
menu_size=3
