min_version = "2026.11.3"

# The front door: `mise tasks` lists these. setup once per clone; build or build-dev to build; dev for the base/pack A/B loop
# and the PC's job queue; test and lint before you push.

[tasks.setup]
description = "Once per clone, safe to repeat: ../Tooling, git hooks, Python requirements, (Linux) the checks' tools; says what is missing"
shell = "bash -c"
depends = ["build-deps", "test-deps"]
run = "python3 -I scripts/setup.py"

[tools]
python = "3.12.15"
node = "22.12.0"
# The Aqua provider has no Windows build; PyPI gives every platform the same pinned pre-commit.
"pypi:pre-commit" = "4.0.1"
"pypi:ruff" = "0.12.0"   # (ruff.toml; pre-commit runs it on changed Python)
"github:rhysd/actionlint" = "1.7.12"
"github:open-policy-agent/conftest" = "0.71.1"
"github:CircleCI-Public/circleci-cli" = "1.14.0"
"github:koalaman/shellcheck" = "0.10.0"
# glslang 16.6.0 linux x86_64 tarball (checksum in test-deps-linux and [tasks.test-deps]); no arm64 release.

[tasks.test-deps]
description = "Pinned headers and glslang the game-free checks use (Linux x86_64; part of setup)"
hide = true
shell = "bash -c"
run = """
set -euo pipefail
if [ "$(uname -s)" != Linux ]; then
  echo 'test-deps: Linux only, skipped'
  exit 0
fi
scripts/fetch_commit.sh https://github.com/KhronosGroup/SPIRV-Headers \
  04f10f650d514df88b76d25e83db360142c7b174 _deps/spirv-headers
scripts/fetch_commit.sh https://github.com/KhronosGroup/Vulkan-Headers \
  74d8a6cb930c68ef617b202c3ff3c59d919e086b _deps/vulkan-headers
tool_dir="$(python3 -I scripts/dev.py paths tools)/glslang-16.6.0"   # (the development folder's: `dev.py paths`)
mkdir -p "$tool_dir"
if [ ! -x "$tool_dir/bin/glslangValidator" ]; then
  curl -fL --retry 3 -o "$tool_dir/glslang.tar.gz" \
    https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-linux-x86_64-release.tar.gz
  echo '2c34071f56ecf39d16233294d3739cf43f981fd39080f2fd9dccb782101191ce  '"$tool_dir/glslang.tar.gz" | sha256sum -c --strict
  tar -xzf "$tool_dir/glslang.tar.gz" -C "$tool_dir"
fi
echo "test-deps: glslang in $tool_dir/bin (on PATH, the shader checks use it)"
python3 -m pip install --disable-pip-version-check --no-deps \
  zstandard==0.25.0 pillow==13.0.0 numpy==2.5.4 lz4==4.4.5 unicorn==2.1.4
"""

[tasks.build-deps]
description = "Install requirements.txt into mise's Python before a game build"
hide = true
shell = "bash -c"
run = "python3 -m pip install --disable-pip-version-check -r requirements.txt"

[tasks.build]
description = "Build a game folder from your own dump (same arguments as nx2/make_game.py; work folder: the development folder's work/)"
shell = "bash -c"
depends = ["build-deps"]
run = """
work=1
for a in "$@"; do case "$a" in --work|--work=*) work= ;; esac; done
# (not the player's builder folder, ~/.cache/longshot-builder or %LOCALAPPDATA%\\LongshotBuilder: `dev.py paths work`)
[ -z "$work" ] || set -- --work "$(python3 -I scripts/dev.py paths work)" "$@"
python3 -I nx2/make_game.py "$@"
"""

[tasks.build-dev]
description = "Compile the lifted tree in work/sa again (LONGSHOT_JOBS, else a compiler per CPU thread but one, as memory allows; RX_HOT_OPT=O1 before it: a quicker build, never measured)"
shell = "bash -c"
depends = ["build-deps"]
# (make_game.py's default_jobs: build.py alone compiles one file at a time, and its memory gate holds back what memory can't)
run = """
jobs="${LONGSHOT_JOBS:-0}"
[ "$jobs" != 0 ] || jobs="$(python3 -I -c 'import os; print(max(1, (os.cpu_count() or 2) - 1))')"
python3 -I nx2/build.py --standalone --jobs "$jobs" "$@"
"""

[tasks.dev]
description = "scripts/dev.py: shared bases, packs and runtimes through the PC's job queue (base, pack, rt, game, queue, paths; --help lists all)"
shell = "bash -c"
depends = ["build-deps"]
run = 'python3 -I scripts/dev.py "$@"'

[tasks.tracy-tools]
description = "Build tracy-capture and tracy-csvexport 0.15.0, the game's Tracy version, into the development folder's tools/tracy-0.15.0/bin (Linux)"
shell = "bash -c"
run = """
set -euo pipefail
# (Tracy's releases have no Linux or macOS programs: built from the pinned source. docs/dev/reference/profiling.md, Tracy)
tool_dir="$(python3 -I scripts/dev.py paths tools)/tracy-0.15.0"   # (the development folder's, shared by every checkout)
if [ -x "$tool_dir/bin/tracy-capture" ] && [ -x "$tool_dir/bin/tracy-csvexport" ]; then
  echo "tracy-tools: $tool_dir/bin (already built)"
  exit 0
fi
for t in cmake ninja c++; do
  command -v "$t" > /dev/null || { echo "tracy-tools: $t is missing"; exit 2; }
done
mkdir -p "$tool_dir/bin"
if [ ! -d "$tool_dir/src" ]; then
  curl -fL --retry 3 -o "$tool_dir/tracy.tar.gz" https://github.com/wolfpld/tracy/archive/refs/tags/v0.15.0.tar.gz
  echo '3d57da54aa67d7875da1e8fecd0bd5957675cef73c27dd52bffb6ab8d290a5e6  '"$tool_dir/tracy.tar.gz" | sha256sum -c --strict
  mkdir -p "$tool_dir/src.part"
  tar -xzf "$tool_dir/tracy.tar.gz" -C "$tool_dir/src.part" --strip-components=1
  mv "$tool_dir/src.part" "$tool_dir/src"
fi
for t in capture csvexport; do
  cmake -S "$tool_dir/src/$t" -B "$tool_dir/build-$t" -G Ninja -DCMAKE_BUILD_TYPE=Release
  cmake --build "$tool_dir/build-$t"
  cp "$tool_dir/build-$t/tracy-$t" "$tool_dir/bin/"
done
echo "tracy-tools: $tool_dir/bin (tracy-capture, tracy-csvexport)"
"""

[tasks.lint]
description = "pre-commit (with ruff) on what this branch changed (as CI does), and actionlint on the workflows"
shell = "bash -c"
run = """
set -euo pipefail
# same range as CI: changes since the merge-base with origin/main (whole tree when there is no origin/main)
if base=$(git merge-base HEAD origin/main 2>/dev/null) && [ "$base" != "$(git rev-parse HEAD)" ]; then
  pre-commit run --from-ref "$base" --to-ref HEAD
else
  pre-commit run --all-files
fi
actionlint -color -config-file .forgejo/actionlint.yaml .forgejo/workflows/*.yml
"""

[tasks."ci:smoke"]
description = "CI's quick check of run_all's JUnit report (Chunk runs it after lint)"
shell = "bash -c"
run = "python3 -I -B tests/test_run_all_junit.py"

[tasks.test-changed]
description = "Only the checks that read a file this branch changed against main (run_all.py --changed [BASE]): a quick look before you push"
shell = "bash -c"
run = 'python3 -I -B tests/run_all.py --strict --changed "$@"'

[tasks.test]
description = "Every game-free check, --strict (arguments: run_all.py's, such as a path filter)"
shell = "bash -c"
run = 'python3 -I -B tests/run_all.py --strict "$@"'

[tasks.ci]
description = "What CI checks on every change, game-free: the pinned test tools, every check (run_all.py --strict) and the website's build and checks"
shell = "bash -c"
depends = ["test-deps"]
run = """
set -euo pipefail
status=0
python3 -I -B tests/run_all.py --strict || status=1   # (the same line CI runs, in parts there)
scripts/website_check.sh || status=1
exit $status
"""
